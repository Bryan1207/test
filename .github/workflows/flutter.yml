name: Flutter checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test-and-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Flutter Android platform files
        run: flutter create --project-name tic_tac_toe_p2p --platforms=android .
      - name: Enable Android Internet access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          p.write_text(s)
          PY
      - name: Install packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload installable Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: tic-tac-toe-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
